<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temps mort — Handball Engine</title>
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#07111f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="../src/css/timeout.css" />
</head>
<body>
  <canvas id="courtCanvas"></canvas>

  <div id="controlBar">
    <span class="bar-label">Attaque</span>
    <select class="bar-select" id="formationA">
      <option value="3-3">3-3</option>
      <option value="2-4">2-4</option>
      <option value="2-5">2-5 (sans G)</option>
      <option value="1-6">1-6 (sans G)</option>
    </select>

    <span class="bar-label">Défense</span>
    <select class="bar-select" id="formationB">
      <option value="6-0">6-0</option>
      <option value="5-1">5-1</option>
      <option value="4-2">4-2</option>
      <option value="3-3">3-3</option>
    </select>

    <div class="bar-sep"></div>

    <button class="bar-btn bar-btn--auto"  id="btnAuto">⟳ Formation auto</button>

    <div class="bar-sep"></div>

    <button class="bar-btn bar-btn--pen"   id="btnPen">✏️ Stylo</button>
    <button class="bar-btn bar-btn--clear" id="btnClear">✕ Effacer flèches</button>
    <button class="bar-btn bar-btn--reset" id="btnReset">↺ Réinitialiser</button>

    <button class="bar-btn bar-btn--fullscreen" id="btnFullscreen">⛶ Plein écran</button>
    <button class="bar-btn bar-btn--home"  id="btnHome">← Accueil</button>
  </div>

  <script src="../src/js/timeout.js"></script>
</body>
</html>
