<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trame — Handball Engine</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/components.css" />
  <link rel="stylesheet" href="/src/css/trame.css" />
  <link rel="stylesheet" href="/src/css/trame-print.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#080b0f" />
  <link rel="apple-touch-icon" href="/assets/icons/pwa-192.png" />
  <script src="/src/js/pwa.js"></script>
</head>
<body class="trame-page">
  <nav id="appNav"></nav>

  <header class="toolbar no-print">
    <button type="button" class="btn" id="btnNew">Nouvelle trame</button>
    <button type="button" class="btn" id="btnList">Mes trames</button>
    <button type="button" class="btn" id="btnBackEditor" hidden>← Retour à la trame</button>
    <span class="toolbar-spacer"></span>
    <span class="save-state" id="saveState" aria-live="polite"></span>
    <button type="button" class="btn btn--primary" id="btnSave" data-write title="Enregistrer (Ctrl+S)">Enregistrer</button>
    <button type="button" class="btn btn--primary" id="btnExport" data-write>Exporter en PDF</button>
    <button type="button" class="btn" id="btnPrint" hidden>Imprimer</button>
  </header>

  <div class="banner no-print" id="draftBanner" hidden>
    <span>Modifications non enregistrées retrouvées.</span>
    <button type="button" class="btn btn--primary btn--small" id="btnDraftResume">Reprendre</button>
    <button type="button" class="btn btn--small" id="btnDraftIgnore">Ignorer</button>
  </div>
  <div class="banner banner--readonly no-print" id="readonlyBanner" hidden>
    <span id="readonlyText"></span>
    <button type="button" class="btn btn--primary btn--small" id="btnResumeVersion">Reprendre cette version</button>
    <button type="button" class="btn btn--small" id="btnLeaveReadonly">Revenir à la trame actuelle</button>
  </div>

  <main id="editorView" class="editor">
    <section class="trame-meta panel-scroll" aria-label="Informations de la trame">
      <label class="field-label" for="fTitre">Titre de la trame</label>
      <input class="field-input" id="fTitre" type="text" maxlength="120" placeholder="Ex : Défense étagée" />
      <label class="field-label" for="fDate">Date</label>
      <input class="field-input" id="fDate" type="date" />
      <label class="field-label" for="fTheme">Thème</label>
      <input class="field-input" id="fTheme" type="text" placeholder="Ex : Repli défensif" />
      <label class="field-label" for="fCoach">Coach</label>
      <input class="field-input" id="fCoach" type="text" placeholder="Nom du coach" />
      <label class="field-label" for="fObjectif">Objectif</label>
      <textarea class="field-input" id="fObjectif" rows="3" placeholder="Objectif de la trame"></textarea>
      <div class="total-box">
        <span class="field-label">Durée totale</span>
        <output id="totalDuree" for="blocList">0 min</output>
        <span class="total-hint">Calculée à partir des exercices</span>
      </div>
      <div class="material-box">
        <span class="field-label">Matériel</span>
        <p id="materialSummary" class="material-summary">—</p>
      </div>
    </section>

    <section class="trame-blocs" aria-label="Blocs de la trame">
      <div id="blocList" class="bloc-list panel-scroll"></div>
      <div class="add-bloc-bar">
        <button type="button" class="btn btn--small" data-addbloc="Échauffement">+ Échauffement</button>
        <button type="button" class="btn btn--small" data-addbloc="Exercice">+ Exercice</button>
        <button type="button" class="btn btn--small" data-addbloc="Opposition libre">+ Opposition libre</button>
        <button type="button" class="btn btn--small" data-addbloc="Retour au calme">+ Retour au calme</button>
        <button type="button" class="btn btn--small" data-addbloc="Bloc libre">+ Bloc libre</button>
      </div>
    </section>

    <aside id="picker" class="picker" aria-label="Exercices des bibliothèques">
      <h2 class="picker-title">Exercices</h2>
      <div class="picker-filters">
        <select id="pLib" class="field-input" aria-label="Bibliothèque"><option value="">Toutes les bibliothèques</option></select>
        <select id="pThem" class="field-input" aria-label="Thématique">
          <option value="">Toutes</option>
          <option value="attaque">Attaque</option>
          <option value="defense">Défense</option>
          <option value="gardien">Gardien</option>
          <option value="enclenchement">Enclenchement</option>
        </select>
        <input id="pSearch" class="field-input" type="search" placeholder="Rechercher…" aria-label="Rechercher un exercice" />
      </div>
      <p class="picker-target" id="pickerTarget"></p>
      <div id="pickerList" class="picker-list panel-scroll"></div>
    </aside>
  </main>

  <main id="trameList" class="trame-list panel-scroll" hidden>
    <h2 class="list-title">Mes trames</h2>
    <div id="trameCards" class="trame-cards"></div>
  </main>

  <div id="documentView" hidden>
    <div class="doc-page" id="docPage"></div>
  </div>

  <script src="/src/js/ui.js"></script>
  <script src="/src/js/api.js"></script>
  <script src="/src/js/snapshots.js"></script>
  <script src="/src/js/seance.js"></script>
</body>
</html>
