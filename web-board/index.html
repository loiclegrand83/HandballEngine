<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Handball Engine</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/components.css" />
  <link rel="stylesheet" href="/src/css/home.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#080b0f" />
  <link rel="apple-touch-icon" href="/assets/icons/pwa-192.png" />
  <script src="/src/js/pwa.js"></script>
</head>
<body class="home-page">
  <nav id="appNav"></nav>

  <main class="home">
    <div class="home-actions">
      <a class="btn btn--primary home-action" href="/pages/board.html?new=1">Nouvel exercice</a>
      <a class="btn btn--primary home-action" href="/pages/seance.html">Nouvelle trame</a>
    </div>

    <section class="home-section home-section--libs" id="homeLibraries" aria-labelledby="hLibs">
      <h2 class="home-title" id="hLibs">Bibliothèques</h2>
      <div class="lib-cards" id="libCards"><p class="home-empty">Chargement…</p></div>
    </section>

    <section class="home-section" id="homeTrames" aria-labelledby="hTrames">
      <h2 class="home-title" id="hTrames">Trames récentes</h2>
      <ul class="home-rows panel-scroll" id="trameRows"><li class="home-empty">Chargement…</li></ul>
    </section>

    <section class="home-section" id="homeExercises" aria-labelledby="hExercises">
      <h2 class="home-title" id="hExercises">Exercices récents</h2>
      <ul class="home-rows panel-scroll" id="exRows"><li class="home-empty">Chargement…</li></ul>
    </section>

    <section class="home-section home-section--backup" id="homeBackup" aria-labelledby="hBackup">
      <h2 class="home-title" id="hBackup">Sauvegarde</h2>
      <div class="backup-actions">
        <a class="btn" id="btnBackup" href="/api/backup" download data-write>Télécharger une sauvegarde complète</a>
        <button type="button" class="btn" id="btnRestore" data-write>Restaurer…</button>
        <input type="file" id="restoreFile" accept="application/json,.json" hidden />
        <a class="btn" href="/pages/guide.html">Guide</a>
      </div>
    </section>
  </main>

  <script src="/src/js/ui.js"></script>
  <script src="/src/js/api.js"></script>
  <script src="/src/js/home.js"></script>
</body>
</html>
