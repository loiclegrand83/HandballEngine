<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Handball Engine</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#07111f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #07111f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e8eaf6;
    }

    .logo {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #90caf9;
      opacity: 0.7;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 56px;
      background: linear-gradient(135deg, #e8eaf6 30%, #90caf9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .cards {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      width: 300px;
      padding: 36px 32px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .card:hover { transform: translateY(-4px); }

    .card--board:hover {
      border-color: rgba(79,156,249,0.5);
      box-shadow: 0 12px 40px rgba(79,156,249,0.15);
    }

    .card--timeout:hover {
      border-color: rgba(255,152,0,0.5);
      box-shadow: 0 12px 40px rgba(255,152,0,0.18);
    }

    .card-icon  { font-size: 2.4rem; }

    .card-title {
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .card--board   .card-title { color: #90caf9; }
    .card--timeout .card-title { color: #ffb74d; }

    .card-desc {
      font-size: 0.85rem;
      opacity: 0.55;
      line-height: 1.6;
    }

    .card-arrow {
      margin-top: 8px;
      font-size: 1.1rem;
      opacity: 0.4;
      transition: opacity 0.2s, transform 0.2s;
    }
    .card:hover .card-arrow { opacity: 1; transform: translateX(4px); }

    @media (max-width: 680px) {
      .cards { flex-direction: column; align-items: center; }
      .card  { width: 90vw; }
    }
  </style>
</head>
<body>
  <p class="logo">Handball Engine</p>
  <h1>Tableau de bord</h1>

  <div class="cards">
    <a class="card card--board" href="board.html" rel="noopener noreferrer">
      <span class="card-icon">📋</span>
      <span class="card-title">Board Tactique</span>
      <span class="card-desc">Créer, animer et documenter<br>des exercices d'entraînement</span>
      <span class="card-arrow">→</span>
    </a>

    <a class="card card--timeout" href="timeout.html" rel="noopener noreferrer">
      <span class="card-icon">⚡</span>
      <span class="card-title">Temps mort</span>
      <span class="card-desc">Instructions tactiques rapides<br>pendant le match</span>
      <span class="card-arrow">→</span>
    </a>
  </div>
</body>
</html>
